<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Blazon V2</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141418">
<style>
  html, body { background: #141418; margin: 0; }
  #ecran-pc { position: fixed; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #141418; }
  #vue-pc {
    position: fixed; right: 12px; bottom: 12px; z-index: 2147483647;
    padding: 6px 12px; border: 0; border-radius: 999px;
    background: rgb(255 255 255 / 0.08); color: rgb(255 255 255 / 0.55);
    font: 500 12px/1.2 system-ui, 'Segoe UI', sans-serif; letter-spacing: 0.02em;
    cursor: pointer; opacity: 0.55; transition: opacity 0.2s, background-color 0.2s;
    backdrop-filter: blur(8px);
  }
  #vue-pc:hover, #vue-pc:focus-visible { opacity: 1; background: rgb(255 255 255 / 0.16); color: #fff; }
  #vue-pc[aria-pressed='true'] { color: #f3f3f6; }
</style>
</head>
<body>
<div id="racine"></div>
<script type="module">
  // Blazon V2. Un écran plus étroit qu'un PC (iPad…) voit la fenêtre d'un PC (1440 px) réduite ;
  // le bouton « Vue PC » bascule entre les deux et le choix est retenu.
  const STYLE = './assets/style-v2.js';
  const ENTREE = './assets/index-BVOcbNK6.js';
  const CLE = 'blazon-v2-vue';

  // Le choix vient du stockage ; s'il est indisponible, d'un « #~pc » / « #~adaptee » posé par le bouton.
  let retenue = location.hash.split('~')[1] ?? null;
  if (retenue !== null) history.replaceState(null, '', location.pathname + location.search + '#/');
  else try { retenue = localStorage.getItem(CLE); } catch { /* stockage indisponible */ }
  const vue = retenue === 'pc' || retenue === 'adaptee' ? retenue : window.innerWidth < 1400 ? 'pc' : 'adaptee';

  const bouton = document.createElement('button');
  bouton.id = 'vue-pc';
  bouton.type = 'button';
  bouton.textContent = 'Vue PC';
  bouton.title = vue === 'pc' ? 'Afficher l’app à la taille de cet écran' : 'Afficher la fenêtre d’un PC, réduite';
  bouton.setAttribute('aria-pressed', String(vue === 'pc'));
  bouton.addEventListener('click', () => {
    const suivante = vue === 'pc' ? 'adaptee' : 'pc';
    try { localStorage.setItem(CLE, suivante); } catch { /* le repère dans l'adresse suffit */ }
    history.replaceState(null, '', location.pathname + location.search + '#~' + suivante);
    location.reload();
  });

  if (vue === 'pc') {
    const LARGEUR = 1440;
    const cadre = document.createElement('iframe');
    cadre.id = 'ecran-pc';
    cadre.title = 'Blazon';
    cadre.src = './app.html';
    const ajuster = () => {
      const echelle = Math.min(1, window.innerWidth / LARGEUR);
      cadre.style.width = LARGEUR + 'px';
      cadre.style.height = Math.ceil(window.innerHeight / echelle) + 'px';
      cadre.style.transform = 'scale(' + echelle + ')';
    };
    ajuster();
    window.addEventListener('resize', ajuster);
    document.getElementById('racine').replaceWith(cadre);
  } else {
    const style = document.createElement('style');
    style.textContent = (await import(STYLE)).default;
    document.head.append(style);
    await import(ENTREE);
  }
</script>
</body>
</html>
